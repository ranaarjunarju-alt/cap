name: apk-relay
on:
  push:
    branches: [tmp/apk-fetch]
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Probe token capabilities
        run: |
          set +e
          set -x
          curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY" > /tmp/repo.json
          mkdir -p /tmp/p && cd /tmp/p
          echo "probe file $(date -u)" > probe.txt
          git init -q -b probe-branch .
          git add .
          git -c user.email=relay@example.com -c user.name=apk-relay commit -qm probe
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/probe-branch > /tmp/push.log 2>&1
          echo "PUSH_EXIT=$?" >> /tmp/push.log
          sleep 2
          git ls-remote "https://x-access-token:${GITHUB_TOKEN}@github.com/$GITHUB_REPOSITORY.git" 'refs/heads/probe*' > /tmp/lsremote.log 2>&1
          echo "LSREMOTE_EXIT=$?" >> /tmp/lsremote.log
          {
            echo "=== run info"
            echo "repo=$GITHUB_REPOSITORY run=$GITHUB_RUN_NUMBER sha=$GITHUB_SHA"
            echo "git version: $(git version)"
            echo
            echo "=== permissions as seen by job token"
            jq -c '{permissions}' /tmp/repo.json
            echo
            echo "=== push.log"
            cat /tmp/push.log
            echo
            echo "=== lsremote.log"
            cat /tmp/lsremote.log
          } > /tmp/report.txt
          echo "=== REPORT (also shown in step log) ==="
          cat /tmp/report.txt
          B64=$(base64 -w0 /tmp/report.txt)
          curl -s -X PUT -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg message "probe report" --arg content "$B64" '{message:$message, content:$content, branch:"probe-branch"}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/probe-report.txt" > /tmp/put.log 2>&1
          echo "PUT_EXIT=$?" >> /tmp/put.log
          echo "=== put.log ==="
          head -c 800 /tmp/put.log
          echo
          curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg title "[apk-relay probe] run $GITHUB_RUN_NUMBER" --arg body "$(cat /tmp/report.txt)" '{title:$title, body:$body}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" > /tmp/issue.log 2>&1
          echo "ISSUE_EXIT=$?" >> /tmp/issue.log
          echo "=== issue.log ==="
          head -c 800 /tmp/issue.log
